name: Build and Deploy (Eleventy → GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "*.njk"
      - "scripts/**"
      - "tests/**"
      - "_includes/**"
      - "_data/**"
      - "projects/**"
      - "robots.njk"
      - "sitemap.njk"
      - "404.njk"
      - "eleventy.config.js"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "CNAME"
      - ".eleventyignore"
      - ".gitignore"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# One job: build and publish on the same runner, so a push goes live without a
# second job spinning up. Browser checks run separately in checks.yml.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Text files only: the photos and videos (1.3 GB) come from the media
      # cache below, so git sends just the few that are new.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.jpg
            !*.jpeg
            !*.png
            !*.gif
            !*.webp
            !*.avif
            !*.mp4
            !*.webm
            !*.mov
            !*.mp3
            !*.m4a
            !*.wav
            !*.ogg

      - name: List photos and videos
        id: media
        run: bash scripts/ci-media.sh list >> "$GITHUB_OUTPUT"

      - name: Restore photos and videos
        id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/site-media
          key: site-media-v1-${{ steps.media.outputs.key }}
          restore-keys: |
            site-media-v1-

      - name: Place photos and videos
        run: bash scripts/ci-media.sh place

      - name: Setup Node (22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reuse encoded source images; only the current image manifest is published.
      - name: Cache build caches
        uses: actions/cache@v4
        with:
          path: |
            .cache
            .11ty-vite
            node_modules/.vite
          key: ${{ runner.os }}-eleventy-images-v2-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-eleventy-images-v2-

      - name: Install
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Detect PATH_PREFIX (CNAME → "/" else "/<repo>")
        run: |
          if [ -f CNAME ]; then
            echo "PATH_PREFIX=/" >> "$GITHUB_ENV"
          else
            echo "PATH_PREFIX=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Build (Eleventy)
        env:
          PATH_PREFIX: ${{ env.PATH_PREFIX }}
        run: npm run build

      - name: Check project data
        run: npm test

      # What actions/upload-pages-artifact does, without zipping: the photos
      # and videos are compressed already, and zipping them took ~15 s.
      - name: Package site
        run: tar --dereference --hard-dereference --directory dist -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # After the deploy, so new photos never hold up publishing.
      - name: Save photos and videos
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/site-media
          key: site-media-v1-${{ steps.media.outputs.key }}
