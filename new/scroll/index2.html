<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Mosaic (looks 2D) — Three.js planes</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #0b0b0b;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      .hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        color: #bbb;
        font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        opacity: 0.8;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hint">Orthographic camera for a perfectly flat look. Press <b>A</b> to spin all tiles once.</div>

    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

      // --- 1) Image filenames (from images/ — RELATIVE PATH, no leading slash)
      const IMAGE_FILES = [
        "00095.jpg",
        "00096.jpg",
        "00097.jpg",
        "00098.jpeg",
        "00099.jpg",
        "00100.jpg",
        "00101.jpg",
        "00102.jpg",
        "00103.jpeg",
        "00104.jpg",
        "00105.jpg",
        "00106.jpg",
        "00107.jpg",
        "00108.jpg",
        "00109.jpg",
        "00110.jpg",
        "00111.jpg",
        "00112.jpg",
        "00113.jpg",
        "00114.jpg",
        "00115.jpg",
        "00116.jpg",
        "00117.jpg",
        "00118.jpg",
        "00119.jpg",
        "00120.jpg",
        "00121.jpg",
        "00122.jpg",
        "00123.jpg",
        "00124.jpg",
        "00125.jpg",
        "00126.jpg",
        "00127.jpg",
        "00128.jpg",
        "00129.jpg",
        "00130.jpg",
        "00131.jpg",
        "00132.jpg",
        "00133.jpg",
        "00134.jpg",
        "00135.jpeg",
        "00136.jpg",
        "00137.jpg",
        "00138.jpg",
        "00139.jpg",
        "00140.jpg",
        "00141.jpg",
        "00142.jpg",
        "00143.jpg",
        "00144.jpg",
        "00145.jpeg",
        "00146.jpg",
        "00147.jpg",
        "00148.jpeg",
        "00149.jpg",
        "00150.jpg",
      ].map((f) => `images/${f}`); // <-- changed here

      // --- 2) Three.js scene setup (orthographic camera so it looks truly 2D)
      const app = document.getElementById("app");
      const scene = new THREE.Scene();

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x0b0b0b, 1);
      app.appendChild(renderer.domElement);

      let cam,
        viewW = 0,
        viewH = 0;
      function updateCamera(w, h) {
        // 1 world unit == 1 CSS pixel
        cam = new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, -1000, 1000);
        cam.position.set(0, 0, 10);
        cam.lookAt(0, 0, 0);
      }

      // --- 3) Texture cache (load once, reuse)
      const loader = new THREE.TextureLoader();
      const texCache = new Map(); // url -> { texture, aspect (w/h), loaded }

      function loadTexture(url) {
        if (texCache.has(url)) return texCache.get(url);
        const entry = { texture: null, aspect: 1, loaded: false };
        texCache.set(url, entry);
        loader.load(
          url,
          (tex) => {
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy?.() || 1);
            tex.generateMipmaps = true;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            tex.magFilter = THREE.LinearFilter;
            entry.texture = tex;
            const img = tex.image;
            entry.aspect = img && img.width && img.height ? img.width / img.height : 1;
            entry.loaded = true;
            reapplyCoverForAllTiles();
          },
          undefined,
          (err) => {
            console.warn("Failed to load", url, err);
            entry.loaded = false;
          }
        );
        return entry;
      }

      // Prefetch all textures (optional, fine for ~50 images)
      IMAGE_FILES.forEach(loadTexture);

      // --- 4) Grid of plane meshes
      const tiles = []; // { mesh, url, texEntry, spin?: {start, dur, from, to} }

      function makeTile(url) {
        const geom = new THREE.PlaneGeometry(1, 1, 1, 1);
        const texEntry = loadTexture(url);
        const mat = new THREE.MeshBasicMaterial({ color: 0x202020 });
        if (texEntry.loaded && texEntry.texture) mat.map = texEntry.texture;
        const mesh = new THREE.Mesh(geom, mat);
        mesh.rotation.z = 0;
        mesh.position.z = Math.random() * 0.001; // avoid z-fighting
        scene.add(mesh);
        return { mesh, url, texEntry };
      }

      function disposeTile(tile) {
        scene.remove(tile.mesh);
        tile.mesh.geometry.dispose();
        tile.mesh.material.dispose();
      }

      // --- 5) Layout logic
      function computeGrid(vw, vh, nImages) {
        const TARGET_TILE_W = 240; // px
        const minCols = 3;
        const cols = Math.max(minCols, Math.round(vw / TARGET_TILE_W));
        const rows = Math.ceil(nImages / cols);
        const tileW = vw / cols;
        const tileH = vh / rows;
        return { cols, rows, tileW, tileH };
      }

      function buildOrUpdateGrid() {
        const nNeeded = grid.cols * grid.rows;
        const nHave = tiles.length;
        for (let i = nHave; i < nNeeded; i++) {
          const url = IMAGE_FILES[i % IMAGE_FILES.length];
          tiles.push(makeTile(url));
        }
        for (let i = tiles.length - 1; i >= nNeeded; i--) {
          const t = tiles.pop();
          disposeTile(t);
        }
      }

      // --- 6) object-fit: cover UVs
      function applyCoverUV(tex, imgAspect, tileAspect) {
        if (!tex) return;
        tex.offset.set(0, 0);
        tex.repeat.set(1, 1);
        if (imgAspect > tileAspect) {
          const repeatX = tileAspect / imgAspect; // < 1
          tex.repeat.set(repeatX, 1);
          tex.offset.set((1 - repeatX) * 0.5, 0);
        } else {
          const repeatY = imgAspect / tileAspect; // < 1
          tex.repeat.set(1, repeatY);
          tex.offset.set(0, (1 - repeatY) * 0.5);
        }
        tex.needsUpdate = true;
      }

      function reapplyCoverForAllTiles() {
        const tileAspect = grid.tileW / grid.tileH;
        for (let i = 0; i < tiles.length; i++) {
          const t = tiles[i];
          const entry = texCache.get(t.url);
          const imgAspect = entry?.aspect || 1;
          if (t.mesh.material.map) applyCoverUV(t.mesh.material.map, imgAspect, tileAspect);
        }
      }

      function layoutGrid() {
        const { cols, rows, tileW, tileH } = grid;
        const startX = -viewW / 2 + tileW / 2;
        const startY = viewH / 2 - tileH / 2;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const i = r * cols + c;
            if (i >= tiles.length) break;
            const tile = tiles[i];
            const entry = texCache.get(tile.url);
            if (entry && entry.loaded && entry.texture && tile.mesh.material.map !== entry.texture) {
              tile.mesh.material.map = entry.texture;
              tile.mesh.material.needsUpdate = true;
            }
            tile.mesh.scale.set(tileW, tileH, 1);
            tile.mesh.position.set(startX + c * tileW, startY - r * tileH, tile.mesh.position.z);

            const imgAspect = entry?.aspect || 1;
            const tileAspect = tileW / tileH;
            if (tile.mesh.material.map) applyCoverUV(tile.mesh.material.map, imgAspect, tileAspect);
          }
        }
      }

      // --- 7) Resize / initial setup
      let grid = { cols: 1, rows: 1, tileW: 1, tileH: 1 };

      function onResize() {
        viewW = window.innerWidth;
        viewH = window.innerHeight;
        renderer.setSize(viewW, viewH, false);
        updateCamera(viewW, viewH);

        grid = computeGrid(viewW, viewH, IMAGE_FILES.length);
        buildOrUpdateGrid();
        layoutGrid();
      }

      window.addEventListener("resize", onResize);
      onResize();

      // --- 8) Simple animation system for a one-shot spin on 'A'
      function nowMs() {
        return performance.now();
      }
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function triggerSpinOnce(duration = 800) {
        const start = nowMs();
        for (const t of tiles) {
          t.spin = { start, dur: duration, from: t.mesh.rotation.z, to: t.mesh.rotation.z + Math.PI * 2 };
        }
      }

      // --- 9) Render loop
      function tick() {
        const tMs = nowMs();
        // advance spins
        for (const tile of tiles) {
          if (tile.spin) {
            const p = (tMs - tile.spin.start) / tile.spin.dur;
            if (p >= 1) {
              tile.mesh.rotation.z = tile.spin.to;
              tile.spin = undefined;
            } else {
              const k = easeOutCubic(Math.max(0, Math.min(1, p)));
              tile.mesh.rotation.z = tile.spin.from + (tile.spin.to - tile.spin.from) * k;
            }
          }
        }
        renderer.render(scene, cam);
        requestAnimationFrame(tick);
      }
      tick();

      // --- 10) Controls: 'A' to spin, 'D' to random tiny depth offset
      window.addEventListener("keydown", (e) => {
        if (e.code === "KeyA" || e.key.toLowerCase() === "a") {
          triggerSpinOnce(900);
        } else if (e.code === "KeyD" || e.key.toLowerCase() === "d") {
          for (const t of tiles) t.mesh.position.z = (Math.random() - 0.5) * 0.5; // subtle depth
        }
      });
    </script>
  </body>
</html>
