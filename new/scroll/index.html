<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Z‑Scroll Projects — stub layout</title>
    <style>
      :root {
        --cameraZ: 0px;
        --article-spacing: 1100; /* bigger spacing to spread out */
        --max-width: 1080px;
        --pad: 1rem;
        --bg: #0b0c10;
        --card: rgba(25, 25, 32, 0.85);
        --border: rgba(255, 255, 255, 0.12);
        --accent: #9ccfff;
        --text: #f0f4fb;
        --muted: #a9b4c2;
      }

      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: radial-gradient(1400px 900px at 70% 20%, #10131a, var(--bg));
        color: var(--text);
        font: 400 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
        overflow-y: scroll;
      }

      .viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        perspective: 2000px; /* zoomed out view, more visible */
      }
      #space {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform: translateZ(var(--cameraZ)) scale(0.85); /* scaled down slightly for wider view */
        will-change: transform;
      }

      article.project {
        position: absolute;
        width: min(90vw, var(--max-width));
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: calc(var(--pad) * 1.5);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        left: 50%;
        top: 50%;
      }
      article.project h2 {
        margin: 0 0 0.25rem 0;
        font-size: clamp(1.25rem, 2.8vw, 2.1rem);
      }
      article.project .meta {
        margin: 0 0 0.75rem 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      article.project p {
        margin: 0.65rem 0;
      }

      figure {
        margin: 0.6rem 0;
      }
      figure img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
      }
      blockquote {
        margin: 0.6rem 0;
        padding-left: 1rem;
        font-style: italic;
        color: #dbe7ff;
        border-left: 3px solid var(--accent);
      }

      .progress {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
      }
      .progress .bar {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transform-origin: 0 50%;
      }

      .hint {
        position: fixed;
        right: 12px;
        bottom: 12px;
        opacity: 0.85;
        font-size: 13px;
        color: var(--muted);
      }
      .hint kbd {
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 6px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      noscript .fallback {
        max-width: var(--max-width);
        margin: 2rem auto;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>

    <noscript>
      <div class="fallback">
        <h1>Projects</h1>
        <p>This page moves through Z space while you scroll. JavaScript is off, so here is a simple list instead.</p>
        <ul>
          <li>Open with JavaScript enabled to see the 3D layout.</li>
        </ul>
      </div>
    </noscript>

    <div class="viewport" aria-hidden="false" aria-live="polite">
      <div id="space"></div>
    </div>

    <div class="hint">Scroll to move in depth. Press <kbd>J</kbd>/<kbd>K</kbd> for step.</div>

    <script>
      const IMAGES = [
        "00095.jpg",
        "00096.jpg",
        "00097.jpg",
        "00098.jpeg",
        "00099.jpg",
        "00100.jpg",
        "00101.jpg",
        "00102.jpg",
        "00103.jpeg",
        "00104.jpg",
        "00105.jpg",
        "00106.jpg",
        "00107.jpg",
        "00108.jpg",
        "00109.jpg",
        "00110.jpg",
        "00111.jpg",
        "00112.jpg",
        "00113.jpg",
        "00114.jpg",
        "00115.jpg",
        "00116.jpg",
        "00117.jpg",
        "00118.jpg",
        "00119.jpg",
        "00120.jpg",
        "00121.jpg",
        "00122.jpg",
        "00123.jpg",
        "00124.jpg",
        "00125.jpg",
        "00126.jpg",
        "00127.jpg",
        "00128.jpg",
        "00129.jpg",
        "00130.jpg",
        "00131.jpg",
        "00132.jpg",
        "00133.jpg",
        "00134.jpg",
        "00135.jpeg",
        "00136.jpg",
        "00137.jpg",
        "00138.jpg",
        "00139.jpg",
        "00140.jpg",
        "00141.jpg",
        "00142.jpg",
        "00143.jpg",
        "00144.jpg",
        "00145.jpeg",
        "00146.jpg",
        "00147.jpg",
        "00148.jpeg",
        "00149.jpg",
        "00150.jpg",
      ];

      const IMAGE_BASE = "images/";
      const GROUP_SIZE = 3;
      const Z_SPACING = Number(getComputedStyle(document.documentElement).getPropertyValue("--article-spacing")) || 1100;
      const scene = document.getElementById("space");
      const progressBar = document.getElementById("bar");

      const QUOTES = [
        "“Work with the grain of the material.”",
        "“Make the complex legible.”",
        "“Iterate in public.”",
        "“Form follows curiosity.”",
        "“Constraints invite invention.”",
        "“Tidy enough to change.”",
      ];

      const DESCS = [
        "Short project description goes here. Outline the intent and the method in a few lines.",
        "A note on process, collaboration, and the site. Replace this text with your own.",
        "Materials, techniques, and context. Keep it brief and readable.",
        "What changed during development and why it matters to the outcome.",
      ];

      function chunk(arr, size) {
        const out = [];
        for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
        return out;
      }

      const projects = chunk(IMAGES, GROUP_SIZE);

      projects.forEach((imgs, i) => {
        const article = document.createElement("article");
        article.className = "project";
        article.setAttribute("tabindex", "0");

        const h2 = document.createElement("h2");
        h2.textContent = `Project ${String(i + 1).padStart(2, "0")}`;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `Images: ${imgs.join(", ")}`;

        article.appendChild(h2);
        article.appendChild(meta);

        if (Math.random() < 0.7) {
          const bq = document.createElement("blockquote");
          bq.textContent = QUOTES[i % QUOTES.length];
          article.appendChild(bq);
        }

        imgs.forEach((name) => {
          const fig = document.createElement("figure");
          const img = document.createElement("img");
          img.loading = "lazy";
          img.decoding = "async";
          img.alt = name;
          img.src = IMAGE_BASE + name;
          fig.appendChild(img);
          article.appendChild(fig);
        });

        const p = document.createElement("p");
        p.textContent = DESCS[i % DESCS.length];
        article.appendChild(p);

        const z = -i * Z_SPACING;
        const radius = 420;
        const angle = i * 0.9;
        const x = Math.sin(angle) * radius;
        const y = Math.cos(angle * 0.7) * 150;
        article.style.transform = `translate(-50%, -50%) translate3d(${x}px, ${y}px, ${z}px)`;

        scene.appendChild(article);
      });

      function setScrollLength() {
        const totalDepth = (projects.length - 1) * Z_SPACING;
        document.body.style.height = totalDepth + window.innerHeight + "px";
      }
      setScrollLength();
      window.addEventListener("resize", setScrollLength);

      let latestY = window.scrollY;
      let ticking = false;

      function update() {
        const cameraZ = latestY; // scroll down moves forward
        scene.style.transform = `translateZ(${cameraZ}px) scale(0.85)`;

        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const p = maxScroll > 0 ? latestY / maxScroll : 0;
        progressBar.style.width = p * 100 + "%";

        ticking = false;
      }

      window.addEventListener(
        "scroll",
        () => {
          latestY = window.scrollY;
          if (!ticking) {
            ticking = true;
            requestAnimationFrame(update);
          }
        },
        { passive: true }
      );

      update();

      window.addEventListener("keydown", (e) => {
        if (e.key.toLowerCase() === "j") window.scrollBy({ top: Z_SPACING, behavior: "smooth" });
        if (e.key.toLowerCase() === "k") window.scrollBy({ top: -Z_SPACING, behavior: "smooth" });
      });
    </script>
  </body>
</html>
