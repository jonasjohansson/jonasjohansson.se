<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width" />
	<style>
	body {
		margin:0;
		overflow:hidden;
		text-align:center;
		font-family:sans-serif;
		font-weight:bold;
		font-size:48px;
	}
	#days {
		line-height:100vh;
	}
	</style>
</head>
<body>
	<div id="days"></div>
	<script>
		window.onload = function(){
			let days = dateDiffInDays(new Date(2016, 8, 8),new Date()) + 31
			let symbols = ["🌹"]
			if (days == 450){
				symbols.push("✨")
			} else if (days == 500){
				for (let i = 0; i < 10; i++){
					let marquee = document.createElement('marquee');
					marquee.setAttribute('scrollamount',Math.random()*20);
					if (Math.random() > 0.5){
						marquee.innerHTML = 'ROSE & JONAS 500 DAGAR!!!';
					} else {
						marquee.innerHTML = symbols[0]+symbols[0]+symbols[0]+symbols[0]+symbols[0];
					}
					marquee.style.width = '100%';
					marquee.style.position = 'absolute';
					marquee.style.left = '0';
					marquee.style.top = (i*10)+'%';
					document.body.appendChild(marquee);
				}
			}
			document.querySelector("#days").innerHTML = days
			setInterval(function(){
				let el = document.createElement("div")
				let x = Math.floor(Math.random()*window.innerWidth)
				let y = Math.floor(Math.random()*window.innerHeight)
				let scale = Math.floor(Math.random()*6)
				let rand = Math.floor(Math.random()*symbols.length)
				el.innerHTML = symbols[rand]
				el.style.position = "absolute"
				el.style.top = y+"px"
				el.style.left = x+"px"
				el.style.transform = "scale("+scale+")"
				document.body.appendChild(el)
			},100)
			function dateDiffInDays(a, b) {
				var utc1 = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
				var utc2 = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
				return Math.floor((utc2 - utc1) / 86400000);
			}
		}
	</script>
</body>
